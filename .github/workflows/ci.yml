name: Quality and deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Format, lint, types, unit, build and browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run security:secrets
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Install isolated PostgreSQL WASM test runtime
        run: npm install --prefix .local/sql-harness --ignore-scripts --no-audit --no-fund --save-exact @electric-sql/pglite@0.5.8
      - name: Validate migrations and database security assertions
        run: node scripts/verify-database.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test the production build in Chromium
        run: npm run test:browser
      - name: Build connected UI with public fixtures (no provider credentials)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://billing-fixture.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_billing_fixture_no_remote_access
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          STRIPE_SECRET_KEY: ''
        run: npm run build
      - name: Test connected billing with mocked providers
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://billing-fixture.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_billing_fixture_no_remote_access
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          STRIPE_SECRET_KEY: ''
        run: npx playwright test e2e/billing.spec.ts e2e/audio-preview.spec.ts --workers=1
      - name: Preserve failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy production
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.VERCEL_DEPLOY_ENABLED == 'true' && vars.SOLACE_BILLING_MIGRATION_0011_READY == 'true' && vars.SOLACE_MOOD_MIGRATION_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify deployment configuration
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN'; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo 'Missing VERCEL_ORG_ID'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'Missing VERCEL_PROJECT_ID'; exit 1; }
          [[ "$VERCEL_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Set VERCEL_CLI_VERSION to an exact reviewed release'; exit 1; }
      - run: npm ci
      - name: Install the pinned deployment CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Pull production project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build with production settings
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Publish the checked revision
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
