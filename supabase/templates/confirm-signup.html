<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirmez votre inscription à Solace</title>
  </head>
  <body style="margin: 0; padding: 24px 16px; background-color: #f7f8f4; color: #283b30">
    <table role="presentation" style="width: 100%; border-collapse: collapse">
      <tr>
        <td align="center">
          <table
            role="presentation"
            style="
              width: 100%;
              max-width: 560px;
              border-collapse: collapse;
              background-color: #ffffff;
            "
          >
            <tr>
              <td
                style="
                  padding: 32px;
                  font-family: Arial, sans-serif;
                  font-size: 16px;
                  line-height: 1.6;
                "
              >
                <p style="margin: 0 0 24px; font-size: 24px; font-weight: 700">Solace</p>
                <h1 style="margin: 0 0 16px; font-size: 24px; line-height: 1.3">
                  Confirmez votre adresse email
                </h1>
                <p style="margin: 0 0 24px">
                  Une inscription à Solace a été demandée avec cette adresse. Confirmez-la pour
                  terminer la création de votre compte.
                </p>
                <p style="margin: 0 0 24px">
                  <a
                    href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=signup"
                    style="
                      display: inline-block;
                      padding: 14px 20px;
                      border-radius: 8px;
                      background-color: #2f6547;
                      color: #ffffff;
                      font-weight: 700;
                      text-decoration: none;
                    "
                    >Confirmer mon inscription</a
                  >
                </p>
                <p style="margin: 0 0 16px; color: #5c6d61; font-size: 14px">
                  Ce lien est personnel. Ne le transférez pas.
                </p>
                <p style="margin: 0; color: #5c6d61; font-size: 14px">
                  Si vous n’êtes pas à l’origine de cette demande, ignorez cet email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
