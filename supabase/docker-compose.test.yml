services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: folia_test
      POSTGRES_PASSWORD: folia-test-only
    volumes:
      - ./:/workspace:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d folia_test']
      interval: 1s
      timeout: 3s
      retries: 30
